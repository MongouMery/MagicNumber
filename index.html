<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script>
(() => {
const R = { h:[140,200], a:[18,75], b:[16,45] };   // 身長cm, 年齢, 隠しBMI（学習では対数で扱う）
/* 隠しパラメータBMI：画面には出さない。身長と体重の組み合わせを現実的にするために使う */
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
// 令和5年国民健康・栄養調査 第14表の年代別平均身長（男性）
const heightMean=a=>a<30?170.3:a<40?171.5:a<50?171.2:a<60?170.5:a<65?169.1:a<70?168.1:a<75?166.6:164.5;
// 現実の分布：標準的な人が9割、肥満寄りが1割の混合
const drawBMI=()=>Math.random()<0.9?22.6*Math.exp(0.13*gauss()):29*Math.exp(0.15*gauss());
// 体型の4区分（候補の出し方だけに使う。判定・学習には区分を使わない）
const BODY=[[16,19.5],[19.5,24],[24,28],[28,42]];   // 華奢・普通・がっしり・肥満
const drawBody=k=>{const [lo,hi]=BODY[k];return Math.exp(rnd(Math.log(lo),Math.log(hi)));};
const LIMIT = 3000, N = 32, STAGES = 3;   // 3ステージ×32人
const view = document.getElementById('view');

let state = { scene:0, round:[], log:[], model:null };

const clamp=(x,lo,hi)=>Math.max(lo,Math.min(hi,x));
const rnd=(lo,hi)=>lo+Math.random()*(hi-lo);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function person(h,a,b){h=Math.round(h);a=Math.round(a);const w=Math.max(1,Math.round(b*(h/100)**2));return {h,w,a,_bmi:w/(h/100)**2};}
const z=(v,[lo,hi])=>clamp((v-lo)/(hi-lo),0,1)*2-1;   // -1..1
const zB=b=>z(Math.log(b),[Math.log(R.b[0]),Math.log(R.b[1])]);
const NF=10;
// 各項目の1次・2次＋組み合わせ（年齢×体型、身長×体型、身長×年齢）
const feats=p=>{const zh=z(p.h,R.h),za=z(p.a,R.a),zb=zB(p._bmi);return [1,zh,zh*zh,za,za*za,zb,zb*zb,za*zb,zh*zb,zh*za];};

/* ---------- 同じ数字を二度出さないための管理 ---------- */
const keyOf=p=>p.h+'/'+p.w+'/'+p.a;
// これまでに表示した数字（全ステージ）。新しい候補はここにある数字と、同じステージ内で既に選んだ数字を弾く
const usedKeys=()=>new Set(state.log.map(r=>keyOf(r.p)));
// 弾かれたら作り直す（最大200回）
function fresh(make,used){for(let i=0;i<200;i++){const p=make();if(!used.has(keyOf(p))){used.add(keyOf(p));return p;}}const p=make();used.add(keyOf(p));return p;}

/* ---------- ① 候補 ---------- */
function scene1Candidates(){
  const n=N/2;
  const strat=([lo,hi])=>shuffle([...Array(n)].map((_,i)=>lo+(i+Math.random())/n*(hi-lo)));
  // 25人：身長・年齢は全範囲から均等に、体型は4区分から均等に
  const H=strat(R.h),A=strat(R.a);
  const K=shuffle([...Array(n)].map((_,i)=>i%4));
  const used=usedKeys();
  const wide=H.map((h,i)=>fresh(()=>person(h,A[i],drawBody(K[i])),used));
  // 25人：現実の分布（平均的な人）
  const real=[...Array(n)].map(()=>fresh(()=>{let a;do{a=Math.round(49+18*gauss());}while(a<R.a[0]||a>R.a[1]);
    return person(clamp(heightMean(a)+5.8*gauss(),R.h[0],R.h[1]),a,drawBMI());},used));
  return shuffle([...wide,...real]);
}

/* ---------- 回答時間 → 重み ---------- */
function weightFor(t, times, idx){
  if(t==null) return 0;
  if(t>LIMIT) return 0.2*(idx<3?0.7:1);        // 3秒を過ぎた判定は最も軽く
  const base=clamp(1-t/LIMIT,0,1);              // 速いほど重い
  const valid=times.filter(x=>x!=null).sort((x,y)=>x-y);
  const med=valid.length?valid[Math.floor(valid.length/2)]:1500;
  const rel=Math.sqrt(clamp(med/Math.max(t,150),0.6,1.6)); // 本人の平均より速いか
  let w=clamp(0.2+0.8*base*rel,0.2,1);
  if(idx<3) w*=0.7;                             // 最初の3人は慣れていないので軽く
  return w;
}

/* ---------- 学習：重み付きロジスティック回帰 ---------- */
function train(rows){
  let beta=new Array(NF).fill(0); const lam=0.03, lr=0.6;
  const data=rows.filter(r=>r.wt>0).map(r=>({x:feats(r.p),y:r.like?1:0,w:r.wt}));
  if(!data.length) return beta;
  // 好きが少ないときに埋もれないよう、好き側の重みを補正
  const wl=data.filter(d=>d.y).reduce((s,d)=>s+d.w,0), wn=data.filter(d=>!d.y).reduce((s,d)=>s+d.w,0);
  const boost=wl>0?clamp(wn/wl,1,6)*0.5+0.5:1;
  data.forEach(d=>{if(d.y)d.w*=boost;});
  const W=data.reduce((s,d)=>s+d.w,0);
  for(let it=0;it<1500;it++){
    const g=new Array(NF).fill(0);
    for(const d of data){let s=0;for(let i=0;i<NF;i++)s+=d.x[i]*beta[i];const e=(1/(1+Math.exp(-s))-d.y)*d.w;for(let i=0;i<NF;i++)g[i]+=e*d.x[i];}
    for(let i=0;i<NF;i++){beta[i]-=lr*(g[i]/W+(i?lam*beta[i]:0));}
  }
  return beta;
}
const logit=(beta,p)=>{const x=feats(p);let s=0;for(let i=0;i<NF;i++)s+=x[i]*beta[i];return s;};

/* ---------- ③ 結果：全組み合わせから最高点 ---------- */
// 隠しBMIは16.5〜42の間なら減点なし。外側だけ少しずつ減点して、現実離れした組み合わせを抑える
const realism=b=>b<16.5?-Math.pow((16.5-b)/1.5,2):b>42?-Math.pow((b-42)/4,2):0;
// 好き・嫌いと判定した人たちとの近さ（カーネル）を点数に足す。
// 回帰だけだと、候補を見せていない範囲の端に結果が飛びやすいので、実際に好きと判定した人の近くを優先する
const BW=0.18, KD=0.6;
// 身長へのこだわりが弱いときに、結果が極端な身長に流れないよう平均身長へ軽く寄せる
const HPRIOR=0.06;
function kernelScore(p,rows){
  const x=[z(p.h,R.h),z(p.a,R.a),zB(p._bmi)];let L=1e-4,D=1e-4;
  for(const r of rows){if(!(r.wt>0))continue;const y=r._z||(r._z=[z(r.p.h,R.h),z(r.p.a,R.a),zB(r.p._bmi)]);
    const d2=((x[0]-y[0])**2+(x[1]-y[1])**2+(x[2]-y[2])**2)/(BW*BW);if(d2>16)continue;const k=Math.exp(-0.5*d2)*r.wt;if(r.like)L+=k;else D+=k;}
  return Math.log(L)-KD*Math.log(D);
}
function bestCombo(beta,rows){
  rows=rows||weightedRows();
  let best=null;
  for(let h=R.h[0];h<=R.h[1];h++)for(let a=R.a[0];a<=R.a[1];a++)for(let b=15;b<=50;b+=0.5){
    const w=Math.round(b*(h/100)**2);const p={h,w,a,_bmi:w/(h/100)**2};
    const s=0.5*logit(beta,p)+realism(p._bmi)-HPRIOR*((h-heightMean(a))/5.8)**2;if(best&&s+3<best.s0)continue;   // 明らかに低い組み合わせは省く
    const t=s+kernelScore(p,rows);if(!best||t>best.s)best={...p,s:t,s0:s};}
  return best;
}

/* ---------- 項目ごとの形と重み（結果の組み合わせを基準に、他の項目を固定して見る） ---------- */
const AX=[{k:'h',name:'身長',unit:'cm',r:R.h,low:'低いほど好き',high:'高いほど好き'},
          {k:'a',name:'年齢',unit:'歳',r:R.a,low:'低いほど好き',high:'高いほど好き'},
          {k:'b',name:'体型',unit:'',r:R.b,low:'細いほど好き',high:'太いほど好き',ends:['BMI16','BMI45']}];
function axisShape(beta,anchor){
  const out=AX.map(ax=>{
    const pts=[...Array(41)].map((_,j)=>{const zz=-1+j/20;const val=ax.k==='b'?Math.exp(Math.log(R.b[0])+(zz+1)/2*(Math.log(R.b[1])-Math.log(R.b[0]))):ax.r[0]+(zz+1)/2*(ax.r[1]-ax.r[0]);
      const p={h:anchor.h,a:anchor.a,_bmi:anchor._bmi};p[ax.k==='b'?'_bmi':ax.k]=val;return {zz,val,v:logit(beta,p)};});
    const vs=pts.map(p=>p.v);const amp=Math.max(...vs)-Math.min(...vs);
    const best=pts.reduce((m,p)=>p.v>m.v?p:m);
    let type='center',label=ax.k==='b'?`BMI${best.val.toFixed(0)}前後が好き`:`${Math.round(best.val)}${ax.unit}前後が好き`;
    if(best.zz<=-0.8){type='edge';label=ax.low;} else if(best.zz>=0.8){type='edge';label=ax.high;}
    if(amp<0.4){type='weak';label='こだわり弱め';}
    return {...ax,pts,amp,peak:best.val,type,label};
  });
  const sum=out.reduce((s,a)=>s+a.amp,0)||1;
  out.forEach(a=>a.share=a.amp/sum);
  return out;
}

/* ---------- ② 候補：好きになりそうな確率で抽選＋探索枠 ---------- */
function scene2Candidates(beta){
  const anchor=bestCombo(beta);const shape=axisShape(beta,anchor);
  const pool=[...Array(6000)].map((_,i)=>person(rnd(...R.h),rnd(...R.a),i%2?drawBMI():drawBody(i%8>>1)));
  const liked=state.log.filter(r=>r.like===true);
  if(liked.length){
    if(state.scene===STAGES){
      // K案：最終ステージは、最終結果と同じ採点（回帰＋好きと判定した数字との近さ）で候補を選ぶ
      const rows=weightedRows();
      pool.forEach(p=>{p._s=0.5*logit(beta,p)+realism(p._bmi)+kernelScore(p,rows);});
      const mx=Math.max(...pool.map(p=>p._s));
      pool.forEach(p=>{p._w=Math.exp(p._s-mx)+1e-9;});
    }else pool.forEach(p=>{p._w=Math.pow(1/(1+Math.exp(-logit(beta,p))),3)+1e-6;});
  }else{
    // ①で好きが0人：嫌いと判定した人たちから離れた組み合わせほど出やすくする
    const pos=p=>[z(p.h,R.h),z(p.a,R.a),zB(p._bmi)];
    const dis=state.log.filter(r=>r.like===false).map(r=>pos(r.p));
    pool.forEach(p=>{const x=pos(p);const d=Math.min(...dis.map(y=>Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2])));p._w=Math.pow(d,4)+1e-6;});
  }
  const lastStage=state.scene===STAGES;
  const nE=lastStage?3:Math.round(N*0.16),nW=lastStage?1:Math.round(N*0.08);   // 探索枠：通常は端寄り5＋全範囲3、最終ステージは端寄り3＋全範囲1
  const used=usedKeys();
  const pick=[];const nExploit=N-nE-nW;
  // 抽選で選ばれても、既に出た数字なら弾いて引き直す
  while(pick.length<nExploit&&pool.length){const tot=pool.reduce((s,p)=>s+p._w,0);let r=Math.random()*tot;let idx=0;for(;idx<pool.length;idx++){r-=pool[idx]._w;if(r<=0)break;}
    const p=pool.splice(Math.min(idx,pool.length-1),1)[0];if(used.has(keyOf(p)))continue;used.add(keyOf(p));pick.push(p);}
  // 探索枠：範囲の端寄り（好みの向きが分かっていればその側、未確定なら左右どちらか）
  const near=(k)=>{const s=shape.find(x=>x.k===k);
    const lg=k==='b';const lo=lg?Math.log(s.r[0]):s.r[0],hi=lg?Math.log(s.r[1]):s.r[1],span=hi-lo;
    const out=v=>lg?Math.exp(v):v;
    const side=lowSide=>out(lowSide?rnd(lo,lo+span*0.15):rnd(hi-span*0.15,hi));
    if(s.type==='edge')return side(s.label===s.low);
    if(s.type==='weak')return side(Math.random()<0.5);
    const pk=lg?Math.log(s.peak):s.peak;return out(clamp(pk+rnd(-0.15,0.15)*span,lo,hi));};
  for(let k=0;k<nE;k++){const p=fresh(()=>person(near('h'),near('a'),near('b')),used);p._explore='edge';pick.push(p);}
  for(let k=0;k<nW;k++){const p=fresh(()=>person(rnd(...R.h),rnd(...R.a),drawBody(k%4)),used);p._explore='wide';pick.push(p);}
  return shuffle(pick);
}

/* ---------- 検証用：画面を使わずに通しで判定させる ---------- */
window.__simulate=(likeFn,noise=0,test=null)=>{
  const saved=state;state={scene:1,round:[],log:[],model:null};
  const judge=(sc,list)=>list.forEach((p,idx)=>{let like=!!likeFn(p);if(Math.random()<noise)like=!like;state.log.push({scene:sc,idx,p,like,t:like?500+Math.random()*500:900+Math.random()*900});});
  for(let sc=1;sc<=STAGES;sc++){state.scene=sc;judge(sc,sc===1?scene1Candidates():scene2Candidates(state.model));state.model=train(weightedRows());}
  const rows=weightedRows();const has=state.log.some(r=>r.like);let best=null,auc=null;
  if(has){best=bestCombo(state.model,rows);
    if(test){const sc=p=>0.5*logit(state.model,p)+realism(p._bmi)-HPRIOR*((p.h-heightMean(p.a))/5.8)**2+kernelScore(p,rows);
      const P=[],Q=[];test.forEach(t=>{const p={h:t[0],a:t[1],_bmi:t[2]};(likeFn(p)?P:Q).push(sc(p));});
      let c=0,n=0;for(const a of P)for(const b of Q){n++;c+=a>b?1:a===b?0.5:0;}auc=n?c/n:null;}}
  state=saved;return {best,auc};
};


/* ---------- 効果音（Web Audioでその場で作る） ---------- */
let actx=null;
function audio(){
  try{ if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C();}
    if(actx.state==='suspended')actx.resume(); return actx; }catch(e){return null;}
}
function noise(ctx,dur){const n=Math.ceil(ctx.sampleRate*dur);const buf=ctx.createBuffer(1,n,ctx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const src=ctx.createBufferSource();src.buffer=buf;return src;}
// スワイプ音「しゅっ」：ノイズを帯域フィルタで高→低に掃く
function sfxSwipe(){
  const ctx=audio();if(!ctx)return;const t=ctx.currentTime,dur=0.2;
  const src=noise(ctx,dur),bp=ctx.createBiquadFilter(),g=ctx.createGain();
  bp.type='bandpass';bp.Q.value=1.2;bp.frequency.setValueAtTime(5200,t);bp.frequency.exponentialRampToValueAtTime(1400,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.5,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(bp).connect(g).connect(ctx.destination);src.start(t);src.stop(t+dur);
}
// カウントダウン音「ピッ」「ピーン」：澄んだ電子音
function sfxBeep(long){
  const ctx=audio();if(!ctx)return;const t=ctx.currentTime,dur=long?0.6:0.09;
  const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=long?1760:880;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.005);
  if(long){g.gain.setValueAtTime(0.35,t+0.08);}
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+dur+0.02);
}
// 制限時間中の「チッ」：ごく短い高域のクリック
function sfxTick(){
  const ctx=audio();if(!ctx)return;const t=ctx.currentTime,dur=0.035;
  const src=noise(ctx,dur),hp=ctx.createBiquadFilter(),g=ctx.createGain();
  hp.type='highpass';hp.frequency.value=3500;
  g.gain.setValueAtTime(0.075,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(hp).connect(g).connect(ctx.destination);src.start(t);src.stop(t+dur);
}

// ドラムロール：回転中の「カラカラ」、止まる「カン」、発表の「ジャーン」
function sfxRoll(){
  const ctx=audio();if(!ctx)return;const t=ctx.currentTime,dur=0.03;
  const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=1200+Math.random()*400;
  g.gain.setValueAtTime(0.04,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+dur+0.01);
}
function sfxStop(){
  const ctx=audio();if(!ctx)return;const t=ctx.currentTime,dur=0.18;
  const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(660,t);o.frequency.exponentialRampToValueAtTime(330,t+dur);
  g.gain.setValueAtTime(0.35,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+dur+0.02);
}
function sfxWin(){
  const ctx=audio();if(!ctx)return;const t=ctx.currentTime;
  [523.25,659.25,783.99,1046.5].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=f;
    const st=t+i*0.09,dur=i===3?0.9:0.25;g.gain.setValueAtTime(0.0001,st);g.gain.exponentialRampToValueAtTime(0.25,st+0.01);g.gain.exponentialRampToValueAtTime(0.0001,st+dur);
    o.connect(g).connect(ctx.destination);o.start(st);o.stop(st+dur+0.02);});
}

// ステージ進捗が埋まったときの「ぴこん」：高めの2音を短く上げる
function sfxPop(){
  const ctx=audio();if(!ctx)return;const t=ctx.currentTime;
  [[1318.5,0,0.06],[1975.5,0.055,0.16]].forEach(([f,st,dur])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t+st);g.gain.exponentialRampToValueAtTime(0.22,t+st+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+st+dur);
    o.connect(g).connect(ctx.destination);o.start(t+st);o.stop(t+st+dur+0.02);});
}
// 結果発表のウェーブ音：数字が左から跳ねるのに合わせて、小さな音を少しずつ高く鳴らす
function sfxWaveBlip(k){
  const ctx=audio();if(!ctx)return;const t=ctx.currentTime,dur=0.13;
  const scale=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5,1567.98,1760];
  const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=scale[Math.min(k,scale.length-1)];
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.13,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+dur+0.02);
}

// 操作音「カチャ」：ごく弱い2連のクリック
function sfxClick(){
  const ctx=audio();if(!ctx)return;const t=ctx.currentTime;
  [0,0.028].forEach((d,i)=>{const src=noise(ctx,0.02),bp=ctx.createBiquadFilter(),g=ctx.createGain();
    bp.type='bandpass';bp.frequency.value=i?2200:3200;bp.Q.value=2;
    g.gain.setValueAtTime(i?0.05:0.07,t+d);g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.02);
    src.connect(bp).connect(g).connect(ctx.destination);src.start(t+d);src.stop(t+d+0.025);});
}

// 画面にアニメーションを載せる。ライブラリが読み込めなかったときは文字の案内に差し替える
function mountGuide(){
  clearGuide();const box=document.getElementById('guide');if(!box)return;
  if(!window.lottie){box.outerHTML=guideText;return;}
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  // 左払い（なし）→右払い（あり）を1回ずつ交互に再生する
  const els=[document.getElementById('guideL'),document.getElementById('guideR')];
  guideAnims=[HAND_LEFT,HAND_RIGHT].map((d,i)=>lottie.loadAnimation({container:els[i],renderer:'svg',loop:false,autoplay:false,animationData:JSON.parse(JSON.stringify(d))}));
  if(reduce){els[0].hidden=false;guideAnims[0].goToAndStop(20,true);return;}   // 動きを減らす設定：左払いの途中で止める
  let cur=0;
  guideAnims.forEach((a,i)=>a.addEventListener('complete',()=>{if(i!==cur)return;els[cur].hidden=true;cur=1-cur;els[cur].hidden=false;guideAnims[cur].goToAndPlay(0,true);}));
  guideAnims[0].play();
}

function startScene(n){
  clearGuide();
  document.documentElement.classList.add('playing');
  state.scene=n;
  state.round=n===1?scene1Candidates():scene2Candidates(state.model);
  let c=3;
  view.innerHTML=`<section class="panel same-h" style="align-items:center;text-align:center"><p class="muted">第${n}ステージ開始まで　あと</p><div class="count" id="cd">3</div></section>`;
  sfxBeep(false);
  const t=setInterval(()=>{c--;if(c<=0){clearInterval(t);sfxBeep(true);runCards(0);}else{document.getElementById('cd').textContent=c;sfxBeep(false);}},700);
}

let tick=null,keyHandler=null,ticker=null,detachSwipe=()=>{};
function runCards(i){
  clearGuide();
  if(i>=N) return finishScene();
  const p=state.round[i];
  view.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
    <div class="progress" aria-label="${i+1}問目／全${N}問">${i+1}/${N}</div>
    <div class="dots" aria-hidden="true">${Array.from({length:N},(_,k)=>`<i${k<=i?' class="on"':''}></i>`).join('')}</div>
    <article class="card" id="card">
      <div class="stamp l" id="sl">あり</div><div class="stamp n" id="sn">なし</div>
      <div class="magic">${p.h}<span class="sl"><svg viewBox="0 0 10 20" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="20" x2="10" y2="0" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke"/></svg><i>/</i></span>${p.w}<span class="sl"><svg viewBox="0 0 10 20" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="20" x2="10" y2="0" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke"/></svg><i>/</i></span>${p.a}</div>
      <div class="timer"><i id="bar"></i></div>
    </article></div>`;
  const t0=performance.now();let done=false;
  const bar=document.getElementById('bar'),card=document.getElementById('card');
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const answer=(like,fromX=0,vx=0)=>{
    if(done)return;done=true;cancelAnimationFrame(tick);document.removeEventListener('keydown',keyHandler);
    clearInterval(ticker);detachSwipe();
    if(like!=null)sfxSwipe();
    const t=like==null?null:performance.now()-t0;
    state.log.push({scene:state.scene,idx:i,p,like,t});
    card.classList.remove('dragging');
    if(like==null||reduce){card.classList.add(like==null?'go-skip':like?'go-like':'go-nope');}
    else{
      // 改善案⑤：離した位置と勢いのまま、画面外へ飛ばす
      const dir=like?1:-1,dist=window.innerWidth*0.9+Math.abs(fromX);
      const dur=Math.round(clamp(260-Math.abs(vx)*90,120,220));
      card.style.transition=`transform ${dur}ms cubic-bezier(.2,.7,.3,1), opacity ${dur}ms ease-out`;
      card.style.transform=`translateX(${dir*dist}px) rotate(${dir*18}deg)`;card.style.opacity='0';
    }
    setTimeout(()=>runCards(i+1),200);
  };
  const loop=()=>{const el=performance.now()-t0;const r=clamp(1-el/LIMIT,0,1);bar.style.transform=`scaleX(${r})`;
    if(el>=LIMIT)return answer(null);   // 制限時間を超えたら判定は無効にして次へ
    tick=requestAnimationFrame(loop);};
  tick=requestAnimationFrame(loop);
  // 制限時間中は秒間4回「チッ」を鳴らす
  clearInterval(ticker);sfxTick();
  ticker=setInterval(()=>{if(done||performance.now()-t0>=LIMIT){clearInterval(ticker);return;}sfxTick();},250);
  keyHandler=e=>{if(e.key==='ArrowRight')answer(true);if(e.key==='ArrowLeft')answer(false);};
  document.addEventListener('keydown',keyHandler);
  // ---- スワイプ（改善案①〜④） ----
  const sl=document.getElementById('sl'),sn=document.getElementById('sn');
  const DIST=80,FLICK_V=0.45,FLICK_MIN=20;   // 判定：80px以上動かす、または速く払う（0.45px/ms以上・20px以上）
  let pid=null,sx=0,sy=0,dx=0,trail=[];
  const setDrag=x=>{card.style.transform=`translateX(${x}px) rotate(${x/20}deg)`;sl.style.opacity=clamp(x/DIST,0,1);sn.style.opacity=clamp(-x/DIST,0,1);};
  const reset=()=>{   // 判定に届かなかったら、バネのように中央へ戻す
    card.classList.remove('dragging');card.style.transition='transform .28s cubic-bezier(.2,1.5,.4,1)';card.style.transform='';
    sl.style.opacity=0;sn.style.opacity=0;setTimeout(()=>{if(!done)card.style.transition='';},300);};
  const down=e=>{if(done||pid!==null||(e.pointerType==='mouse'&&e.button!==0))return;
    pid=e.pointerId;sx=e.clientX;sy=e.clientY;dx=0;trail=[[e.timeStamp,e.clientX]];
    card.style.transition='';card.classList.add('dragging');};   // 改善案①：ドラッグ中は補間なしで指に追従
  const move=e=>{if(e.pointerId!==pid||done)return;dx=e.clientX-sx;setDrag(dx);
    trail.push([e.timeStamp,e.clientX]);while(trail.length>2&&e.timeStamp-trail[0][0]>90)trail.shift();
    if(e.cancelable)e.preventDefault();};
  const up=e=>{if(e.pointerId!==pid)return;pid=null;if(done)return;
    dx=e.clientX-sx;
    // 直近の払う速さ（px/ms）：指を離す直前0.1秒の動きから求める。止めてから離した場合は0になる
    const rec=trail.filter(q=>q[0]>=e.timeStamp-100);
    const vx=rec.length>=2?(rec[rec.length-1][1]-rec[0][1])/Math.max(16,e.timeStamp-rec[0][0]):0;
    // 改善案②：距離か、払う速さで判定
    const right=dx>=DIST||(vx>=FLICK_V&&dx>=FLICK_MIN),left=dx<=-DIST||(vx<=-FLICK_V&&dx<=-FLICK_MIN);
    if(right)answer(true,dx,vx);else if(left)answer(false,dx,vx);else reset();};
  const cancel=e=>{if(e.pointerId!==pid)return;pid=null;if(!done)reset();};   // 改善案④：横取りされたら元に戻す
  // 改善案③：カードの上だけでなく画面全体で受け付ける
  document.addEventListener('pointerdown',down);document.addEventListener('pointermove',move,{passive:false});
  document.addEventListener('pointerup',up);document.addEventListener('pointercancel',cancel);
  detachSwipe=()=>{document.removeEventListener('pointerdown',down);document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',cancel);};
}

function weightedRows(){
  const times=state.log.map(r=>r.t);
  const rows=state.log.map(r=>{const inScene=state.log.filter(x=>x.scene===r.scene).indexOf(r);
    const w=weightFor(r.t,times,inScene)*(r.scene>=2?1.5:1);return {...r,wt:w};});
  // 改善案G：押し間違え対策。近くの判定と食い違う判定（周りが「なし」ばかりの「あり」など）ほど軽く扱う
  const pos=r=>r._z||(r._z=[z(r.p.h,R.h),z(r.p.a,R.a),zB(r.p._bmi)]);
  const BG=0.3;
  const agree=rows.map(r=>{if(!(r.wt>0))return 1;const x=pos(r);let same=0.4,diff=0.4;   // 近くに誰もいなければ中立
    for(const o of rows){if(o===r||!(o.wt>0))continue;const y=pos(o);const d2=((x[0]-y[0])**2+(x[1]-y[1])**2+(x[2]-y[2])**2)/(BG*BG);if(d2>9)continue;
      const k=Math.exp(-0.5*d2)*o.wt;if(o.like===r.like)same+=k;else diff+=k;}
    return same/(same+diff);});
  rows.forEach((r,i)=>{if(r.wt>0)r.wt*=clamp(0.15+1.7*agree[i]*agree[i],0.15,1);});
  return rows;
}

function finishScene(){
  document.documentElement.classList.remove('playing');
  const rows=weightedRows();
  state.model=train(rows);
  const cur=state.log.filter(r=>r.scene===state.scene);
  const nl=cur.filter(r=>r.like===true).length,nn=cur.filter(r=>r.like===false).length,ns=cur.filter(r=>r.like==null).length;
  if(state.scene<STAGES){
    const n=state.scene;
    view.innerHTML=`<section class="panel same-h" style="align-items:center;text-align:center;padding-block:36px;gap:18px">
      <h2>第${n}ステージ終了</h2>
      <div class="stagebar" role="img" aria-label="全${STAGES}ステージ中${n}ステージ完了">${Array.from({length:STAGES},(_,k)=>`<i class="${k<n?'on':''}${k===n-1?' new':''}"></i>`).join('')}</div>
      <div style="margin-top:36px"><button class="btn" id="next">第${n+1}ステージ開始</button></div></section>`;
    // 新しく埋まる区間が濃いグレーになりきったところで「ぽこっ」
    const seg=document.querySelector('.stagebar i.new');const reduceM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(seg){if(reduceM)sfxPop();else seg.addEventListener('animationend',sfxPop,{once:true});}
    document.getElementById('next').onclick=()=>startScene(n+1);
  } else showResult(rows);
}

function curveSVG(ax,mark){
  const W=300,H=64,pad=6;const vs=ax.pts.map(p=>p.v);const mn=Math.min(...vs),mx=Math.max(...vs),mid=(mn+mx)/2,half=((mx-mn)/2)||1;
  // 好みの強さをS字に変換して描く（大小の順序はそのまま、直線に見えないようにする）
  const S=v=>1/(1+Math.exp(-3.2*(v-mid)/half));const s0=S(mn),s1=S(mx),ss=(s1-s0)||1;
  const lab=i=>ax.ends?ax.ends[i]:ax.r[i]+ax.unit;
  const X=zz=>pad+(zz+1)/2*(W-2*pad),Y=v=>H-pad-(S(v)-s0)/ss*(H-2*pad-10);
  const P=ax.pts.map(p=>[X(p.zz),Y(p.v)]);
  // 点を滑らかな曲線（3次ベジェ）でつなぐ
  let d=`M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;
  for(let j=0;j<P.length-1;j++){const p0=P[Math.max(0,j-1)],p1=P[j],p2=P[j+1],p3=P[Math.min(P.length-1,j+2)];
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+=`C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;}
  const mz=ax.k==='b'?zB(mark):z(mark,ax.r);const mv=ax.pts.reduce((m,p)=>Math.abs(p.zz-mz)<Math.abs(m.zz-mz)?p:m).v;
  return `<svg class="curve" viewBox="0 0 ${W} ${H+17}" role="img" aria-label="${ax.name}の好みの曲線">
    <line x1="${pad}" x2="${W-pad}" y1="${H-1.5}" y2="${H-1.5}" stroke="var(--line)" stroke-width="1"/>
    <path d="${d}" fill="none" stroke="var(--ink)" stroke-width="2"/>
    <circle cx="${X(mz)}" cy="${Y(mv)}" r="5" fill="var(--like)"/>
    <text x="${pad}" y="${H+13}" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${lab(0)}</text>
    <text x="${W-pad}" y="${H+13}" font-size="11" fill="var(--muted)" text-anchor="end" font-family="IBM Plex Mono,monospace">${lab(1)}</text>
  </svg>`;
}

function showResult(rows){
  if(!rows.some(r=>r.like===true)){
    view.innerHTML=`<section class="panel" style="align-items:center;text-align:center"><h2>測定失敗</h2><p style="text-wrap:balance">すべての数字に「なし」と回答したため、あなたの好きな数字がわかりませんでした。</p><div><button class="btn" id="again">もう一度遊ぶ</button></div></section>`;
    document.getElementById('again').onclick=intro;return;
  }
  const best=bestCombo(state.model,rows);const sh=axisShape(state.model,best);
  const val={h:best.h,a:best.a,b:best._bmi};
  const order=[...sh].sort((x,y)=>y.share-x.share);
  // 「あり」を押すのが速かった順にベスト5（「なし」と判定した数字は出さない）
  const seen=new Set();
  const top5=rows.filter(r=>r.like===true&&r.t!=null).sort((x,y)=>x.t-y.t).filter(r=>{const k=r.p.h+'/'+r.p.w+'/'+r.p.a;if(seen.has(k))return false;seen.add(k);return true;}).slice(0,5);   // 同じ数字が別ステージで出た場合は1回だけ
  // 表示上の回答時間（小数2桁）が直前の行と同じなら同順位とみなし、2個目以降の順位は空欄にする。
  // 次に時間が変わった行は、続きの番号（1位のあとは2位）にする
  const sec=r=>(r.t/1000).toFixed(2);let rank=0;
  const log=top5.map((r,i)=>{const tie=i>0&&sec(r)===sec(top5[i-1]);if(!tie)rank++;return `<tr${rank===1?' class="first"':''}><td>${tie?'':rank}</td><td class="num">${r.p.h}/${r.p.w}/${r.p.a}</td><td>${sec(r)}秒</td></tr>`;}).join('');
  view.innerHTML=`<div style="display:flex;flex-direction:column;gap:16px">
  <section class="panel result-main">
    <p class="muted" style="text-align:center;width:100%"><span class="dash-u">あなたが好きな「魔法の数字」</span></p>
    <div class="magic" id="reels"><span class="reel" id="r0">${best.h}</span><span class="sl"><svg viewBox="0 0 10 20" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="20" x2="10" y2="0" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke"/></svg><i>/</i></span><span class="reel" id="r1">${best.w}</span><span class="sl"><svg viewBox="0 0 10 20" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="20" x2="10" y2="0" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke"/></svg><i>/</i></span><span class="reel" id="r2">${best.a}</span></div>
  <details class="detail" id="detail" hidden><summary>詳細</summary>
    <h2 style="margin-top:16px;text-align:center">あなたの判定の傾向</h2>
    ${order.map(s=>`<div class="axis">
      <div class="axis-head"><span>${s.name}：${s.label}</span><span class="muted" style="font-family:var(--f-mono)">重要度：${Math.round(s.share*100)}%</span></div>
      ${curveSVG(s,val[s.k])}
    </div>`).join('')}
    <h2 style="margin-top:28px;text-align:center">「あり」判定即答ランキング</h2>
    <div class="logwrap"><table class="top5"><thead><tr><th>順位</th><th>魔法の数字</th><th>判定時間</th></tr></thead><tbody>${log}</tbody></table></div>
  </details>
  </section>
  <div class="row" id="afterRow" hidden style="justify-content:center"><a class="btn ghost" id="shareX" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(`私が好きな「魔法の数字」は ${best.h}/${best.w}/${best.a} でした。`)}" target="_blank" rel="noopener">Xで共有</a><button class="btn" id="again">もう一度遊ぶ</button></div></div>`;
  document.getElementById('again').onclick=intro;
  drumroll([best.h,best.w,best.a],()=>{document.getElementById('detail').hidden=false;document.getElementById('afterRow').hidden=false;});
}

/* ---------- 結果発表のドラムロール ---------- */
// 確定した数字を、左から右へ観客のウェーブのように1回だけ跳ねさせる
function wave(done){
  const m=document.getElementById('reels');if(!m){done();return;}
  const items=[];
  [...m.children].forEach(c=>{
    if(c.classList.contains('reel')){const txt=c.textContent;c.textContent='';[...txt].forEach(ch=>{const sp=document.createElement('span');sp.className='wv';sp.textContent=ch;c.appendChild(sp);items.push(sp);});}
    else if(c.classList.contains('sl'))items.push(c);
  });
  const STEP=60,DUR=520;
  items.forEach((el,k)=>{el.style.animation=`wave ${DUR}ms cubic-bezier(.3,.7,.4,1) ${k*STEP}ms both`;setTimeout(()=>sfxWaveBlip(k),k*STEP);});
  setTimeout(done,(items.length-1)*STEP+DUR);
}
function drumroll(vals,done){
  const els=[0,1,2].map(i=>document.getElementById('r'+i));
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){sfxWin();done();return;}
  // 回転中も最終値と同じ桁数の数字を出して、桁が変わって横幅がずれないようにする
  const ranges=vals.map((v,i)=>{const lim=[[140,200],[30,150],[18,75]][i];const d=String(v).length;return [Math.max(lim[0],10**(d-1)),Math.min(lim[1],10**d-1)];});
  const stopAt=[1100,1600,2100];const t0=performance.now();const stopped=[false,false,false];
  els.forEach(e=>e.classList.add('spin'));
  const iv=setInterval(()=>{
    const el=performance.now()-t0;let spinning=false;
    els.forEach((e,i)=>{if(stopped[i])return;
      if(el>=stopAt[i]){stopped[i]=true;e.textContent=vals[i];e.classList.remove('spin');e.classList.add('stop');sfxStop();return;}
      spinning=true;const [lo,hi]=ranges[i];e.textContent=Math.floor(lo+Math.random()*(hi-lo+1));});
    if(spinning)sfxRoll();
    if(stopped.every(Boolean)){clearInterval(iv);setTimeout(()=>wave(()=>{sfxWin();done();}),200);}
  },70);
}

intro();
})();
</script>
